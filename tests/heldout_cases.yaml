# Held-out set: random lines from the subs2srs decks (seed 20261119), annotated by
# hand BEFORE running the parser on them. Do not tune the parser against this file;
# add new cases to parser_cases.yaml instead and use this one to measure progress.
# Names are annotated as names even where only deck context could tell (ライト is
# the exception: a common word that no sentence-level rule can know is a name).
# 2026-11-19: English loanwords no longer counted as words (user decision), so the four
# loanword items (ゴースト, シリアルナンバー, ファイル, ライト) were removed from the
# expectations. 2026-11-20: loanwords are words again (they count as known, not filtered),
# so the four items are back as first written. Nothing else was changed after the first run.


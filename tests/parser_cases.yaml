# Hand-checked parser cases. Run: i1sort eval-parser -v
#
# words:    the counted (non-filtered) words in order, written as any JMdict spelling
#           of the expected entry (可愛い matches a かわいい token); add 【reading】
#           to pin the reading, or use the JMdict sequence number.
# filtered: surface → expected filter reason ("counted" = must not be filtered).
# same:     texts that must each give exactly one counted word, all with the same key.
# cleaned:  expected text after subtitle cleanup.

# ---------------------------------------------------------------- conjugation
- text: 食べさせられなかった
  words: [食べる]
  filtered: {させ: aux, られ: aux, なかっ: aux, た: aux}
  tags: [conjugation]
- text: 宿題を忘れちゃった
  words: [宿題, 忘れる]
  filtered: {ちゃっ: aux}
  tags: [conjugation]
- text: もう行かなきゃ
  words: [もう, 行く]
  filtered: {なきゃ: aux}
  tags: [conjugation]
- text: 本を読んでる
  words: [本, 読む]
  filtered: {でる: aux}
  tags: [conjugation]
- text: ご飯を食べてる
  words: [ご飯, 食べる]
  filtered: {てる: aux}
  tags: [conjugation]
- text: 見ておいてください
  words: [見る]
  filtered: {おい: grammar, ください: grammar}
  tags: [conjugation]
- text: 言わせてもらえませんか
  words: [言う]
  filtered: {もらえ: grammar}
  tags: [conjugation]
- text: 書かれていた手紙
  words: [書く, 手紙]
  filtered: {い: grammar}
  tags: [conjugation]
- text: 忘れられない思い出
  words: [忘れる, 思い出]
  tags: [conjugation]
- text: 走りたくなかった
  words: [走る]
  tags: [conjugation]
- text: 早く来いよ
  words: [早い, 来る]
  tags: [conjugation]
- text: 静かにしろ
  words: [静か]   # に+しろ may merge as the grammar expression にしろ; either way only 静か counts
  tags: [conjugation]
- text: 勉強しなければならない
  words: [勉強]
  filtered: {し: grammar, なければならない: grammar}
  tags: [conjugation, grammar]
- text: 映画を見に行った
  words: [映画, 見る, 行く]
  tags: [conjugation, expressions]
- text: 帰ってきた
  words: [帰る]
  filtered: {き: grammar}
  tags: [conjugation]
- text: 死なせない
  words: [死ぬ]
  tags: [conjugation]
- text: 待たせてしまってすみませんでした
  words: [待つ]
  filtered: {しまっ: grammar, すみませんでした: interjection}
